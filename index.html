<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPortal WebGIS</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body>
    <div id="app-container">
        <!-- Backdrop for mobile sidebar -->
        <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

        <!-- Sidebar / Control Panel -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-top">
                    <h2><i class="fa-solid fa-earth-americas"></i> GeoPortal</h2>
                    <button id="sidebar-close" class="sidebar-close-btn" title="Recolher Menu" aria-label="Recolher Menu">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                </div>
                <p>Op. PROLEPSE X Cicatrizes de Queimada 2025</p>
            </div>
            
            <div class="sidebar-content">
                <div class="panel-section">
                    <h3>Camadas (Layers)</h3>
                    <div class="layer-list" id="layer-list">
                        <!-- Layers will be injected here via JS -->
                    </div>
                </div>

                <div class="panel-section sources-section">
                    <h3>Fontes dos Dados</h3>
                    <div class="source-item">
                        <div class="color-box" style="background-color: #B2DF8A; border-color: #B2DF8A;"></div>
                        <span>Polígono do Imóvel - SICAR</span>
                    </div>
                    <div class="source-item">
                        <div class="color-box" style="background-color: #d35400; border-color: #d35400;"></div>
                        <span>Cicatrizes de Queimadas - IMASUL</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <p>&copy; 2026 GeoPortal MS</p>
            </div>
        </aside>

        <!-- Main Map Area -->
        <main id="map-container">
            <!-- Floating Menu Toggle Button -->
            <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Alternar Menu" aria-label="Alternar Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Basemap Selector - Google Maps Style -->
            <div class="basemap-picker" id="basemap-selector">
                <!-- Basemaps will be injected here via JS -->
            </div>

            <div id="map"></div>
            
            <!-- Loading Indicator -->
            <div id="loading-overlay" class="hidden">
                <div class="spinner"></div>
                <p id="loading-text">Carregando dados...</p>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- SweetAlert2 for nice alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom JS -->
    <script src="assets/js/app.js?v=10"></script>
</body>
</html>
